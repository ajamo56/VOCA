<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>うごけ！ロボット VOCA</title><style>

 .mode-panel{background:#e9f3fa;border:2px solid #b6d1e2;border-radius:16px;padding:12px;margin:8px 0 16px;text-align:center}.mode-panel p{margin:0 0 10px;font-weight:700;font-size:18px}.mode-buttons{display:flex;gap:10px;justify-content:center}.mode-button{flex:1;max-width:320px;min-height:58px;border:3px solid #9db8cd;background:white;border-radius:14px;font-size:clamp(17px,3vw,23px);font-weight:800}.mode-button[aria-pressed="true"]{background:#d3efdd;border-color:#238451}.mode-note{margin-top:8px!important;font-size:14px!important;color:#405d6b} </style></head><body><header><h1>🤖 うごけ！ ロボット</h1></header><main><section id="home"><div class="mode-panel"><p>つかう ことばを えらぼう</p><div class="mode-buttons"><button type="button" class="mode-button" data-mode="basic" aria-pressed="false">Aの ことば</button><button type="button" class="mode-button" data-mode="command" aria-pressed="true">B・C・Dの ことば</button></div><p class="mode-note" id="mode-note">いまは B・C・Dの ことば</p></div><h2>つかいたい えを えらぼう</h2><div class="choices"><button class="choice" data-page="0" type="button"><span class="num">1</span><span>すすむ・もどる</span></button><button class="choice" data-page="1" type="button"><span class="num">2</span><span>むきを かえる</span></button><button class="choice" data-page="2" type="button"><span class="num">3</span><span>おどる・うたう</span></button><button class="choice" data-page="3" type="button"><span class="num">4</span><span>かお・きもち</span></button></div></section><section class="page" id="page0" hidden><h2>1　すすむ・もどる</h2><div class="commands"><button type="button" class="command " data-say="すすめ！"><svg viewBox="0 0 160 165" role="img" aria-hidden="true"><rect x="48" y="44" width="64" height="66" rx="13" fill="#d9e8f3" stroke="#315c76" stroke-width="4"/><rect x="55" y="14" width="50" height="40" rx="12" fill="#f4fafc" stroke="#315c76" stroke-width="4"/><circle cx="70" cy="34" r="5" fill="#315c76"/><circle cx="90" cy="34" r="5" fill="#315c76"/><path d="M59 113v18m42-18v18M47 65l-15 17m80-17 15 17" stroke d="page2" hidden><h2>3　おどる・うたう</h2><div class="commands"><button type="button" class="command " data-say="おどって！"><svg viewBox="0 0 160 165" role="img" aria-hidden="true"><rect x="48" y="44" width="64" height="66" rx="13" fill="#d9e8f3" stroke="#315c76" stroke-width="4"/><rect x="55" y="14" width="50" height="40" rx="12" fill="#f4fafc" stroke="#315c76" stroke-width="4"/><circle cx="70" cy="34" r="5" fill="#315c76"/><circle cx="90" cy="34" r="5" fill="#315c76"/><path d="M59 113v18m42-18v18M47 65l-15 17m80-17 15 17" stroke="#315c76" stroke-width="9" stroke-linecap="round"/><path d="M10 25l10-12 10 12M130 25l10-12 10 12" stroke="#c27518" stroke-width="5" fill="none"/><text x="123" y="36" font-size="25">♪</text></svg><strong>おどって！</strong></button><button type="button" class="command " data-say="うたって！"><svg viewBox="0 0 160 165" role="img" aria-hidden="true"><rect x="48" y="44" width="64" height="66" rx="13" fill="#d9e8f3" stroke="#315c76" stroke-width="4"/><rect x="55" y="14" width="50" height="40" rx="12" fill="#f4fafc" stroke="#315c76" stroke-width="4"/><circle cx="70" cy="34" r="5" fill="#315c76"/><circle cx="90" cy="34" r="5" fill="#315c76"/><path d="M59 113v18m42-18v18M47 65l-15 17m80-17 15 17" stroke="#315c76" stroke-width="9" stroke-linecap="round"/><text x="112" y="35" font-size="36" fill="#8d5aaf">♫</text></svg><strong>うたって！</strong></button><button type="button" class="command stop" data-say="とまれ！"><svg viewBox="0 0 160 165" role="img" aria-hidden="true"><rect x="48" y="44" width="64" height="66" rx="13" fill="#d9e8f3" stroke="#315c76" stroke-width="4"/><rect x="55" y="14" width="50" height="40" rx="12" fill="#f4fafc" stroke="#315c76" stroke-width="4"/><circle cx="70" cy="34" r="5" fill="#315c76"/><circle cx="90" cy="34" r="5" fill="#315c76"/><path d="M59 113v18m42-18v18M47 65l-15 17m80-17 15 17" stroke="#315c76" stroke-width="9" stroke-linecap="round"/><path d="M20 30h120v85H20z" rx="12" fill="none"/><path d="M80 18v-12" stroke="#d45242" stroke-width="7"/><path d="M30 26l100 100M130 26L30 126" stroke="#d45242" stroke-width="12" stroke-linecap="round"/></svg><strong>とまれ！</strong></button></div><button class="back" type="button">◀ えらびなおす</button></section><section class="page" id="page3" hidden><h2>4　かお・きもち</h2><div class="commands"><button type="button" class="command " data-say="おこって！"><svg viewBox="0 0 160 165" role="img" aria-hidden="true"><rect x="48" y="44" width="64" height="66" rx="13" fill="#d9e8f3" stroke="#315c76" stroke-width="4"/><rect x="55" y="14" width="50" height="40" rx="12" fill="#f4fafc" stroke="#315c76" stroke-width="4"/><circle cx="70" cy="34" r="5" fill="#315c76"/><circle cx="90" cy="34" r="5" fill="#315c76"/><path d="M59 113v18m42-18v18M47 65l-15 17m80-17 15 17" stroke="#315c76" stroke-width="9" stroke-linecap="round"/><path d="M60 26l17 8m23-8-17 8" stroke="#bc4949" stroke-width="5"/><path d="M65 45h30" stroke="#bc4949" stroke-width="4"/></svg><strong>おこって！</strong></button><button type="button" class="command " data-say="わらって！"><svg viewBox="0 0 160 165" role="img" aria-hidden="true"><rect x="48" y="44" width="64" height="66" rx="13" fill="#d9e8f3" stroke="#315c76" stroke-width="4"/><rect x="55" y="14" width="50" height="40" rx="12" fill="#f4fafc" stroke="#315c76" stroke-width="4"/><circle cx="70" cy="34" r="5" fill="#315c76"/><circle cx="90" cy="34" r="5" fill="#315c76"/><path d="M59 113v18m42-18v18M47 65l-15 17m80-17 15 17" stroke="#315c76" stroke-width="9" stroke-linecap="round"/><path d="M66 42q14 15 28 0" fill="none" stroke="#25845a" stroke-width="4"/></svg><strong>わらって！</strong></button><button type="button" class="command stop" data-say="とまれ！"><svg viewBox="0 0 160 165" role="img" aria-hidden="true"><rect x="48" y="44" width="64" height="66" rx="13" fill="#d9e8f3" stroke="#315c76" stroke-width="4"/><rect x="55" y="14" width="50" height="40" rx="12" fill="#f4fafc" stroke="#315c76" stroke-width="4"/><circle cx="70" cy="34" r="5" fill="#315c76"/><circle cx="90" cy="34" r="5" fill="#315c76"/><path d="M59 113v18m42-18v18M47 65l-15 17m80-17 15 17" stroke="#315c76" stroke-width="9" stroke-linecap="round"/><path d="M20 30h120v85H20z" rx="12" fill="none"/><path d="M80 18v-12" stroke="#d45242" stroke-width="7"/><path d="M30 26l100 100M130 26L30 126" stroke="#d45242" stroke-width="12" stroke-linecap="round"/></svg><strong>とまれ！</strong></button></div><button class="back" type="button">◀ えらびなおす</button></section></main><div id="status" role="status" aria-live="polite">えを おすと こえが でるよ</div><footer>しゅわ・こえ・みぶりでも いいよ。</footer><script>
(function(){
 const home=document.getElementById('home'), pages=[...document.querySelectorAll('.page')], status=document.getElementById('status');
 function show(n){home.hidden=n!==-1;pages.forEach((p,i)=>p.hidden=i!==n);status.textContent='えを おすと こえが でるよ';window.scrollTo(0,0)}
 document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.page))));
 document.querySelectorAll('.back').forEach(b=>b.addEventListener('click',()=>show(-1)));
 document.querySelectorAll('[data-say]').forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.say;status.textContent='🔊 '+t;
  b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),450);
  if(!('speechSynthesis' in window)){status.textContent='こえを だせません：Safariで ひらいてね';return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace('！',''));u.lang='ja-JP';u.rate=1.0;u.volume=1;const voices=speechSynthesis.getVoices();const ja=voices.find(v=>v.lang.toLowerCase().startsWith('ja'));u.onerror=()=>{status.textContent='こえが でません。Safariと おとの せっていを かくにんしてね'};speechSynthesis.speak(u)}
  catch(e){status.textContent='こえが でません。Safariで ためしてね'}
 }));
   const words = {'すすめ！':'すすむ','もどれ！':'もどる','とまれ！':'とまる','みぎ！':'みぎ','ひだり！':'ひだり','おどって！':'おどる','うたって！':'うたう','おこって！':'おこる','わらって！':'わらう'};
  const buttons = [...document.querySelectorAll('[data-say]')];
  let mode = 'command';
  function setMode(next) {
    mode = next;
    buttons.forEach(b => {
      const original = b.dataset.original || b.dataset.say;
      b.dataset.original = original;
      const word = mode === 'basic' ? (words[original] || original) : original;
      b.dataset.say = word;
      b.querySelector('strong').textContent = word;
    });
    document.querySelectorAll('[data-mode]').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    });
    document.getElementById('mode-note').textContent =
      mode === 'basic' ? 'いまは Aの ことば' : 'いまは B・C・Dの ことば';
    try { localStorage.setItem('voca-mode', mode); } catch(e) {}
  }
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.addEventListener('click', () => setMode(b.dataset.mode))
  );
  try { mode = localStorage.getItem('voca-mode') === 'basic' ? 'basic' : 'command'; } catch(e) {}
  setMode(mode);

 show(-1);
})();
</script></body></html>
